<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Forgot Password - PageFairy</title>
   <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;700&family=DM+Sans:wght@400;700&family=Oleo+Script:wght@400;700&display=swap" rel="stylesheet">
   <script src="https://cdn.tailwindcss.com"></script>
   <link href="https://cdn.jsdelivr.net/npm/daisyui@4.10.1/dist/full.min.css" rel="stylesheet" type="text/css" />
    <!-- Password reset is handled by Pages Functions at /api/auth/* -->
</head>
<body style="background-color: #F1F5F9; font-family: 'DM Sans', sans-serif !important; font-weight: 500 !important; ">


   <main class="flex items-center justify-center min-h-screen p-4">
       <div class="w-full max-w-md">
           <div class="text-center mb-8">
               <h1 class="text-4xl font-bold text-slate-800 mb-3" style=" font-family: 'Oleo Script', cursive !important; font-weight: 700 !important; ">PageFairy</h1>
               <p class="text-slate-500">Forgot your password? We'll help you reset it.</p>
           </div>


           <div class="card bg-white shadow-xl border">
               <div class="card-body p-8">
                   <p class="text-slate-500 mb-6 text-center">Enter the email address associated with your account, and we'll send you a link to reset your password.</p>
                  
                   <form id="forgot-form" class="space-y-4">
                       <div class="form-control">
                           <label class="label"><span class="label-text">Email Address</span></label>
                           <input id="email" type="email" placeholder="you@example.com" class="input input-bordered w-full" required />
                       </div>
                      
                       <div class="form-control pt-2">
                           <button type="submit" class="btn btn-primary w-full text-white" style="background-color: #ff7096;">Send Reset Link</button>
                       </div>
                   </form>
               </div>
           </div>
           <div class="text-center mt-4">
               <a href="login.html" class="text-sm">Back to Login</a>
           </div>
       </div>
   </main>
    <script src="js/app.js"></script>
    <script>
        document.getElementById('forgot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();

            try {
                const redirectTo = `${window.location.origin}/reset-password.html`;
                await window.PageFairyAPI.Auth.forgotPassword(email, redirectTo);
                alert('If an account exists, a reset link was sent.');
            } catch (err) {
                alert('Request failed: ' + (err?.message || err));
            }
        });
    </script>
</body>
</html>
